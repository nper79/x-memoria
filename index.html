<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex">
  <!-- Os vídeos do X recusam pedidos que dizem vir de outro site: não enviar a origem. -->
  <meta name="referrer" content="no-referrer">
  <title>X Memória</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f1ea;
      --surface: #fffdf9;
      --ink: #1d1b17;
      --ink-2: #4a453c;
      --muted: #8a8274;
      --line: #e4ddd0;
      --accent: #c2410c;
      --accent-soft: #c2410c14;
      --serif: "Instrument Serif", Georgia, serif;
      --read: "Newsreader", Georgia, serif;
      --ui: "Instrument Sans", system-ui, sans-serif;
      --top: 60px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12110f;
        --surface: #1a1916;
        --ink: #efe9de;
        --ink-2: #c9c1b2;
        --muted: #8b8476;
        --line: #2b2823;
        --accent: #f0743b;
        --accent-soft: #f0743b1f;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    input, textarea, select {
      font: inherit; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }

    /* ---------- barra de topo ---------- */
    .top {
      position: sticky; top: 0; z-index: 20; height: var(--top);
      display: flex; align-items: center; gap: 16px; padding: 0 20px;
      background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .brand { font-family: var(--serif); font-size: 28px; line-height: 1; white-space: nowrap; }
    .brand em { color: var(--accent); }
    .modes { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin: 0 auto; }
    .modes button { padding: 7px 18px; border-radius: 999px; font-weight: 500; color: var(--muted); }
    .modes button.active { background: var(--ink); color: var(--bg); }
    .top-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
    #banner { font-size: 13px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
    .icon-btn:hover { background: var(--surface); color: var(--ink); }

    .mode { display: none; }
    .mode.active { display: grid; }

    /* ---------- LER ---------- */
    #read { grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
    .topics {
      position: sticky; top: var(--top); align-self: start; height: calc(100vh - var(--top)); overflow-y: auto;
      padding: 22px 14px 22px 20px; border-right: 1px solid var(--line);
    }
    .topics .search { margin-bottom: 18px; }
    .topics h3 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 8px; }
    .topics ul { list-style: none; margin: 0; padding: 0; }
    .topics li button { width: 100%; display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); text-align: left; }
    .topics li button:hover { background: var(--surface); }
    .topics li button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .topics li button .n { color: var(--muted); font-variant-numeric: tabular-nums; }

    .feed { padding: 34px 24px 120px; }
    .feed-inner { max-width: 660px; margin: 0 auto; }
    .feed-title { font-family: var(--serif); font-weight: 400; font-size: 46px; line-height: 1; margin: 0 0 6px; }
    .feed-title em { color: var(--accent); }
    .feed-sub { color: var(--muted); margin-bottom: 26px; }

    .post {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px 26px 16px; margin-bottom: 18px;
      animation: rise .4s both; animation-delay: calc(var(--i, 0) * 30ms);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .post-head { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; font-size: 16px; }
    .who { min-width: 0; flex: 1; }
    .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .meta { color: var(--muted); font-size: 13.5px; }
    .post-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .tag { font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .post-title { font-family: var(--serif); font-weight: 400; font-size: 27px; line-height: 1.12; margin: 16px 0 0; }
    .post-body { font-family: var(--read); font-size: 19px; line-height: 1.62; margin-top: 12px; color: var(--ink); overflow-wrap: anywhere; }
    .post-body p { margin: 0 0 .8em; }
    .post-body p:last-child { margin-bottom: 0; }
    .post-body a { text-decoration: none; }
    .post-body.clamped { max-height: 420px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
    .read-more { margin-top: 6px; color: var(--accent); font-weight: 600; }
    .quote { margin: 14px 0 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; font-family: var(--read); font-size: 16.5px; color: var(--ink-2); white-space: pre-wrap; }
    .quote::before { content: "Citação"; display: block; font: 600 11px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .linkcard { margin: 14px 0 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 10px 10px 0; font-size: 14.5px; color: var(--ink-2); white-space: pre-wrap; }
    .media { display: grid; gap: 4px; margin-top: 14px; border-radius: 14px; overflow: hidden; }
    .media.n2, .media.n4 { grid-template-columns: 1fr 1fr; }
    .media.n3 { grid-template-columns: 1fr 1fr; }
    .media.n3 a:first-child { grid-row: span 2; }
    .media img { width: 100%; height: 100%; max-height: 520px; object-fit: cover; display: block; background: var(--line); }
    .media.n1 img { max-height: 640px; object-fit: contain; background: transparent; }
    .post-foot { display: flex; gap: 18px; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    .post-foot a, .post-foot button { color: var(--muted); text-decoration: none; }
    .post-foot a:hover, .post-foot button:hover { color: var(--accent); }
    .post-foot .spacer { flex: 1; }
    .summary-line { margin-top: 10px; font-size: 14px; color: var(--muted); }
    .summary-line b { color: var(--ink-2); font-weight: 600; }

    .more { display: block; margin: 10px auto 0; padding: 10px 22px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
    .empty { text-align: center; color: var(--muted); padding: 70px 10px; }
    .empty .big { font-family: var(--serif); font-size: 38px; color: var(--ink); line-height: 1.1; margin-bottom: 8px; }

    /* ---------- CONVERSAR ---------- */
    #chat { grid-template-columns: 260px minmax(0, 1fr); height: calc(100vh - var(--top)); }
    .chats { border-right: 1px solid var(--line); padding: 18px 12px; overflow-y: auto; }
    .new-chat { width: 100%; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 600; text-align: left; margin-bottom: 18px; }
    .chats h3 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 8px; }
    .chats ul { list-style: none; margin: 0; padding: 0; }
    .chats li { display: flex; align-items: center; border-radius: 8px; }
    .chats li:hover { background: var(--surface); }
    .chats li.active { background: var(--accent-soft); }
    .chats li .open { flex: 1; min-width: 0; text-align: left; padding: 8px 10px; }
    .chats li .open .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
    .chats li.active .open .t { color: var(--accent); font-weight: 600; }
    .chats li .open .d { display: block; font-size: 12px; color: var(--muted); }
    .chats li .del { padding: 6px 10px; color: var(--muted); opacity: 0; }
    .chats li:hover .del { opacity: 1; }
    .chats .none { color: var(--muted); font-size: 14px; padding: 0 8px; }

    .conversation { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .conv-head { display: none; }
    #messages { flex: 1; overflow-y: auto; padding: 30px 24px 20px; }
    .messages-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 82%; }
    .msg.assistant { font-family: var(--read); font-size: 18px; line-height: 1.6; }
    .msg.assistant b { font-weight: 600; }
    .msg.activity { font-size: 13px; color: var(--muted); }
    .msg.activity::before { content: "· "; }
    .msg.error { color: #b42318; border: 1px solid currentColor; padding: 10px 14px; border-radius: 10px; }
    .intro { padding-top: 6vh; }
    .intro .big { font-family: var(--serif); font-size: 50px; line-height: 1; margin-bottom: 12px; }
    .intro .big em { color: var(--accent); }
    .suggest { display: grid; gap: 10px; margin-top: 22px; }
    .suggest button { text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-family: var(--read); font-size: 17px; color: var(--ink-2); }
    .suggest button:hover { border-color: var(--accent); color: var(--ink); }

    .composer-wrap { padding: 12px 24px calc(16px + env(safe-area-inset-bottom)); }
    .composer {
      max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 8px 8px 8px 16px;
      box-shadow: 0 10px 30px -20px rgba(0,0,0,.4);
    }
    .composer textarea { border: 0; padding: 8px 0; background: transparent; resize: none; max-height: 180px; outline: none; font-size: 16px; }
    .composer textarea:focus { outline: none; }
    .mic, .send { width: 42px; height: 42px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
    .mic { color: var(--ink-2); }
    .mic:hover { background: var(--bg); }
    .mic.listening { background: #dc2626; color: #fff; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 #dc262666; } 50% { box-shadow: 0 0 0 10px #dc262600; } }
    .send { background: var(--ink); color: var(--bg); }
    .send:disabled { opacity: .4; }
    .voice-hint { max-width: 720px; margin: 6px auto 0; font-size: 12.5px; color: var(--muted); text-align: center; min-height: 1em; }

    /* ---------- definições ---------- */
    dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--bg); color: var(--ink); width: min(500px, calc(100vw - 32px)); padding: 24px; }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    dialog h2 { font-family: var(--serif); font-weight: 400; font-size: 34px; margin: 0 0 4px; }
    dialog label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
    dialog .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 22px; }
    .btn { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
    .btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn.quiet { border-color: transparent; background: none; color: var(--muted); }
    .reveal-wrap { position: relative; }
    .reveal-wrap input { padding-right: 86px; }
    .reveal-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 8px; color: var(--muted); }


    /* ---------- lista: extras ---------- */
    .post { cursor: pointer; transition: border-color .15s; }
    .post:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
    img.avatar { object-fit: cover; background: var(--line); }
    .tick { color: #1d9bf0; font-size: 13px; }
    .media .m { position: relative; overflow: hidden; }
    .media .m img { width: 100%; height: 100%; max-height: 520px; object-fit: cover; display: block; background: var(--line); }
    .media.n1 .m img { max-height: 560px; }
    .media .m.is-video::after {
      content: "▶"; position: absolute; inset: 0; margin: auto; width: 58px; height: 58px; border-radius: 50%;
      background: rgba(0,0,0,.6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; padding-left: 4px;
    }
    .media.n3 .m:first-child { grid-row: span 2; }
    .quoted { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .quoted .q-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .quoted .q-head .avatar { width: 22px; height: 22px; font-size: 11px; }
    .quoted .q-body { font-family: var(--read); font-size: 16.5px; line-height: 1.55; margin-top: 6px; }
    .quoted .q-body p { margin: 0 0 .6em; }
    .xcard { display: flex; gap: 12px; margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: var(--ink); text-decoration: none; }
    .xcard img { width: 120px; object-fit: cover; flex: none; }
    .xcard > div { padding: 10px 12px; min-width: 0; }
    .xcard .d { font-size: 12.5px; color: var(--muted); }
    .xcard .t { font-weight: 600; }
    .xcard .s { font-size: 13.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .read-more { margin-top: 8px; color: var(--accent); font-weight: 600; }

    /* ---------- leitor de post ---------- */
    .post-view {
      position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
      transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.7,.2,1); visibility: hidden;
    }
    .post-view.on { transform: none; visibility: visible; }
    .pv-bar { position: sticky; top: 0; z-index: 2; padding: 12px 20px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .pv-close { font-weight: 600; color: var(--ink-2); padding: 6px 4px; }
    .pv-close:hover { color: var(--accent); }
    .pv-inner { max-width: 700px; margin: 0 auto; padding: 32px 22px 120px; }
    .pv-author { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .pv-author .avatar { width: 52px; height: 52px; font-size: 20px; }
    .pv-author .name { font-weight: 600; font-size: 17px; }
    .pv-title { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1.05; margin: 0 0 22px; }
    .full-body, .article { font-family: var(--read); font-size: 21px; line-height: 1.68; overflow-wrap: anywhere; }
    .full-body p, .article p { margin: 0 0 1em; }
    .full-body a, .article a { text-decoration: none; }
    .article h1, .article h2, .article h3 { font-family: var(--serif); font-weight: 400; line-height: 1.15; margin: 1.3em 0 .5em; }
    .article h1 { font-size: 36px; } .article h2 { font-size: 30px; } .article h3 { font-size: 25px; }
    .article img { width: 100%; height: auto; border-radius: 12px; margin: 10px 0 18px; display: block; }
    .article blockquote { margin: 1em 0; padding-left: 16px; border-left: 3px solid var(--accent); color: var(--ink-2); font-style: italic; }
    .article pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 14px; }
    .full-media { display: grid; gap: 10px; margin: 22px 0; }
    .full-media img, .full-media video { width: 100%; height: auto; max-height: 85vh; object-fit: contain; border-radius: 14px; background: #000; display: block; }
    .full-media img { background: var(--line); }
    .post-view .quoted .q-body { font-size: 18px; }
    .pv-stats { margin-top: 20px; color: var(--muted); font-size: 14px; }
    .pv-note { margin-top: 16px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink-2); font-size: 14px; }
    .pv-summary { margin-top: 26px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); font-size: 15px; }
    .pv-summary b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .pv-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .pv-actions a.btn { text-decoration: none; color: var(--ink); }
    @media (max-width: 820px) {
      .pv-inner { padding: 22px 16px 100px; }
      .full-body, .article { font-size: 19px; }
      .pv-title { font-size: 34px; }
      .xcard img { width: 90px; }
    }


    /* ---------- leitor v2 ---------- */
    .post-cover { width: 100%; aspect-ratio: 5 / 2; object-fit: cover; border-radius: 12px; margin-top: 14px; display: block; background: var(--line); }
    .pv-cover { width: 100%; border-radius: 16px; margin: 0 0 22px; display: block; }
    .article ul, .article ol { padding-left: 1.3em; margin: 0 0 1em; }
    .article li { margin-bottom: .35em; }
    .article video, .article img { width: 100%; border-radius: 12px; margin: 10px 0 18px; display: block; }
    .article video { background: #000; max-height: 85vh; }
    .post-view .pv-inner { padding-bottom: 40px; }
    .pc-section { margin-top: 34px; padding-top: 22px; border-top: 2px solid var(--ink); }
    .pc-title { font-family: var(--serif); font-size: 28px; margin-bottom: 14px; }
    .pc-messages { display: flex; flex-direction: column; gap: 16px; }
    .pc-dock { position: sticky; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
    .pc-dock .composer { max-width: 700px; }

    /* ---------- telemóvel ---------- */
    @media (max-width: 820px) {
      .top { padding: 0 10px; gap: 6px; }
      .top-right { gap: 0; }
      #refresh { display: none; }
      .brand { font-size: 22px; }
      #banner { display: none; }
      .modes button { padding: 6px 14px; }
      #read { grid-template-columns: minmax(0, 1fr); }
      .topics { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; background: var(--bg); }
      .topics .search { margin-bottom: 8px; }
      .topics h3 { display: none; }
      .topics ul { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
      .topics li button { white-space: nowrap; border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; }
      .feed { padding: 20px 10px 100px; }
      .feed-title { font-size: 36px; }
      .post { padding: 18px 16px 12px; border-radius: 14px; }
      .post-body { font-size: 18px; }
      .post-tags { display: none; }
      .post-foot { gap: 14px; font-size: 13.5px; white-space: nowrap; }
      #chat { grid-template-columns: minmax(0, 1fr); height: calc(100dvh - var(--top)); }
      .chats { display: none; position: fixed; inset: var(--top) 0 0 0; z-index: 15; background: var(--bg); border: 0; }
      body.show-chats .chats { display: block; }
      .conv-head { display: flex; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--line); }
      #messages { padding: 20px 14px; }
      .intro .big { font-size: 40px; }
      .composer-wrap { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">X <em>Memória</em></div>
    <nav class="modes">
      <button data-mode="read" class="active">Ler</button>
      <button data-mode="chat">Conversar</button>
    </nav>
    <div class="top-right">
      <span id="banner"></span>
      <button class="icon-btn" id="refresh" title="Atualizar">↻</button>
      <button class="icon-btn" id="open-settings" title="Definições">⚙</button>
    </div>
  </header>

  <!-- ===== LER ===== -->
  <section id="read" class="mode active">
    <aside class="topics">
      <div class="search"><input id="search" type="search" placeholder="Procurar…" aria-label="Procurar"></div>
      <h3>Tópicos</h3>
      <ul id="topics"></ul>
    </aside>
    <main class="feed">
      <div class="feed-inner">

<script>
const $ = s => document.querySelector(s);
const CFG_KEYS = ['supabaseUrl', 'supabaseKey', 'provider', 'apiKey', 'model'];
const MODELS = {
  anthropic: { opus: 'claude-opus-5-5', sonnet: 'claude-sonnet-5-5' },
  openrouter: { opus: 'anthropic/claude-opus-5.5', sonnet: 'anthropic/claude-sonnet-5.5' }
};
const BATCH = 15;
const PAGE_SIZE = 25;

const state = {
  articles: [],
  topic: null,     // null = tudo, '' = por organizar
  limit: PAGE_SIZE,
  history: [],     // mensagens enviadas à IA (append-only)
  display: [],     // o que fica guardado: [{ role, text }]
  chatId: null,
  chatTitle: '',
  chatIndex: null, // snapshot dos artigos no início da conversa
  busy: false,
  classifying: false
};

// ---------- utilidades ----------
function cfg() {
  const c = {};
  for (const k of CFG_KEYS) { try { c[k] = localStorage.getItem('xmem_' + k) || ''; } catch { c[k] = ''; } }
  c.supabaseUrl = (c.supabaseUrl || 'https://jwwpazwvhtyivyklvoma.supabase.co').replace(/\/+$/, '');
  c.provider ||= c.apiKey.startsWith('sk-ant-') ? 'anthropic' : 'openrouter';
  c.model = c.model.includes('sonnet') ? 'sonnet' : 'opus';
  c.modelId = MODELS[c.provider][c.model];
  return c;
}
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const renderMarkdown = t => escapeHtml(t)
  .replace(/^#{1,4} (.+)$/gm, '<b>$1</b>')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('pt-PT', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtShort = iso => iso ? new Date(iso).toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' }) : '';
const topicsOf = a => Array.isArray(a.topics) ? a.topics : [];
const setBanner = t => { $('#banner').textContent = t || ''; };
const handle = a => (a.author || '').match(/@\w+/)?.[0] || '';
const authorName = a => (a.author || '').split('@')[0].replace(/[·\s]+$/, '').trim() || handle(a) || a.source || '';
function avatarColor(s) {
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 45% 45%)`;
}

// ---------- Supabase ----------
async function sb(path, opts = {}) {
  const c = cfg();
  const res = await fetch(`${c.supabaseUrl}/rest/v1/${path}`, {
    ...opts,
    headers: { apikey: c.supabaseKey, ...(c.supabaseKey.startsWith('eyJ') ? { Authorization: `Bearer ${c.supabaseKey}` } : {}), 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
  const body = await res.text();
  return body ? JSON.parse(body) : null;
}

async function loadArticles() {
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const page = await sb('articles?select=*&order=saved_at.desc', { headers: { Range: `${from}-${from + 999}` } });
    rows.push(...page);
    if (page.length < 1000) break;
  }
  state.articles = rows;
  render();
}

async function updateArticle(id, fields) {
  await sb(`articles?id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', body: JSON.stringify(fields) });
  const a = state.articles.find(x => x.id === id);
  if (a) Object.assign(a, fields);
}

// ---------- Claude (streaming, acumula blocos de conteúdo) ----------
async function claude(body, onText) {
  const c = cfg();
  if (!c.apiKey) throw new Error('Falta a chave da API (⚙️).');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': c.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'anthropic-beta': 'server-side-fallback-2026-07-01'
    },
    body: JSON.stringify({ model: c.modelId, stream: true, fallbacks: 'default', ...body })
  });
  if (!res.ok) {
    let detail = await res.text();
    try { detail = JSON.parse(detail).error.message; } catch {}
    throw new Error(`Erro da API (${res.status}): ${detail}`);
  }

  let blocks = [], json = {}, stopReason = null, buffer = '';
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const events = buffer.split('\n\n');
    buffer = events.pop();
    for (const evt of events) {
      const line = evt.split('\n').find(l => l.startsWith('data: '));
      if (!line) continue;
      const d = JSON.parse(line.slice(6));
      switch (d.type) {
        case 'message_start': blocks = []; json = {}; break;
        case 'content_block_start':
          blocks[d.index] = { ...d.content_block };
          if (d.content_block.type === 'tool_use') json[d.index] = '';
          break;
        case 'content_block_delta': {
          const b = blocks[d.index], x = d.delta;
          if (x.type === 'text_delta') { b.text += x.text; onText?.(x.text); }
          else if (x.type === 'thinking_delta') b.thinking += x.thinking;
          else if (x.type === 'signature_delta') b.signature = (b.signature || '') + x.signature;
          else if (x.type === 'input_json_delta') json[d.index] += x.partial_json;
          break;
        }
        case 'content_block_stop':
          if (d.index in json) {
            try { blocks[d.index].input = json[d.index] ? JSON.parse(json[d.index]) : {}; }
            catch { blocks[d.index].input = {}; }
          }
          break;
        case 'message_delta': stopReason = d.delta.stop_reason; break;
        case 'error': throw new Error(d.error?.message || 'Erro no stream');
      }
    }
  }
  return { content: blocks.filter(Boolean), stopReason };
}

// ---------- OpenRouter (API compatível com OpenAI; sem streaming para preservar o raciocínio) ----------
async function openrouter(body) {
  const c = cfg();
  if (!c.apiKey) throw new Error('Falta a chave da API do OpenRouter (⚙️).');
  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${c.apiKey}`, 'X-Title': 'X Memoria' },
    body: JSON.stringify({ model: c.modelId, ...body })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(`Erro do OpenRouter (${res.status}): ${data.error?.message || res.statusText}`);
  return data.choices[0];
}

// ---------- organização por tópico ----------
const CLASSIFY_PROMPT = `Organizas a biblioteca pessoal de leitura de uma pessoa (posts e artigos guardados do X/Twitter).

Para cada artigo devolve:
- topicos: 1 a 3 tópicos curtos em português (1-2 palavras, ex.: Marketing, IA, Startups, Produtividade, Programação, Finanças, Vendas, Design, Saúde). Reutiliza os tópicos que já existem sempre que servirem; cria um novo só quando nenhum serve. A lista total deve ficar pequena e geral (idealmente menos de 20 tópicos).
- titulo: título curto e descritivo em português (máx. 12 palavras), mesmo que o post original não tenha título.
- resumo: 1 a 2 frases em português com o assunto e a ideia principal. Se for só uma piada, anúncio ou opinião curta, diz isso.

Devolve um item por artigo, com o mesmo id.`;

const CLASSIFY_SCHEMA = {
  type: 'object',
  properties: {
    items: {
      type: 'array',
      items: {
        type: 'object',
        properties: {
          id: { type: 'string' },
          topicos: { type: 'array', items: { type: 'string' } },
          titulo: { type: 'string' },
          resumo: { type: 'string' }
        },
        required: ['id', 'topicos', 'titulo', 'resumo'],
        additionalProperties: false
      }
    }
  },
  required: ['items'],
  additionalProperties: false
};

async function classifyPending() {
  if (state.classifying || !cfg().apiKey) return;
  const pending = state.articles.filter(a => !topicsOf(a).length);
  if (!pending.length) return;
  state.classifying = true;
  let done = 0;
  try {
    for (let i = 0; i < pending.length; i += BATCH) {
      setBanner(`A organizar por tópico… ${done}/${pending.length}`);
      const batch = pending.slice(i, i + BATCH);
      const existing = [...topicCounts().keys()];
      const userText = `Tópicos que já existem: ${existing.join(', ') || '(nenhum ainda)'}\n\n` +
        batch.map(a => `<artigo id="${a.id}" autor="${escapeHtml(a.author)}">\n${a.text.slice(0, 6000)}\n</artigo>`).join('\n\n');
      let text;
      if (cfg().provider === 'openrouter') {
        const choice = await openrouter({
          max_tokens: 16000,
          reasoning: { effort: 'low' },
          response_format: { type: 'json_schema', json_schema: { name: 'organizacao', strict: true, schema: CLASSIFY_SCHEMA } },
          messages: [{ role: 'system', content: CLASSIFY_PROMPT }, { role: 'user', content: userText }]
        });
        if (choice.finish_reason === 'length' || !choice.message?.content) { done += batch.length; continue; }
        text = choice.message.content;
      } else {
        const res = await claude({
          max_tokens: 16000,
          output_config: { effort: 'low', format: { type: 'json_schema', schema: CLASSIFY_SCHEMA } },
          system: CLASSIFY_PROMPT,
          messages: [{ role: 'user', content: userText }]
        });
        if (res.stopReason === 'refusal' || res.stopReason === 'max_tokens') { done += batch.length; continue; }
        text = res.content.filter(b => b.type === 'text').map(b => b.text).join('');
      }
      const { items } = JSON.parse(text);
      for (const it of items) {
        if (!batch.some(a => a.id === it.id)) continue;
        await updateArticle(it.id, { topics: it.topicos.slice(0, 3), title: it.titulo, summary: it.resumo });
      }
      done += batch.length;
      render();
    }
  } catch (err) {
    setBanner('Erro ao organizar: ' + err.message);
    state.classifying = false;
    return;
  }
  state.classifying = false;
  setBanner('');
}


// ---------- chat com índice + ferramentas ----------
const CHAT_PROMPT = `És o assistente de leitura pessoal do utilizador. Ele guarda posts e artigos do X (Twitter) e quer ajuda para tirar partido deles.

Em baixo está o ÍNDICE de tudo o que ele guardou: número, tópicos, autor, data, título e resumo. O índice só tem resumos — para avaliar, comparar, recomendar ou citar artigos, lê-os primeiro com a ferramenta ler_artigos (podes ler vários de uma vez). Usa procurar quando ele pergunta por algo específico que pode não estar nos resumos.

Quando recomendas, sê honesto e crítico: diz quais valem a pena e porquê, e quais são fracos (ex.: só autopromoção, sem substância). Refere os artigos pelo título e autor e inclui o link original. Responde em português de Portugal, direto e sem floreados.`;

const TOOLS = [
  {
    name: 'ler_artigos',
    description: 'Lê o texto completo de artigos do índice, pelos seus números. Usa antes de avaliar, comparar, resumir em detalhe ou recomendar. Até 10 artigos por chamada.',
    input_schema: {
      type: 'object',
      properties: { numeros: { type: 'array', items: { type: 'integer' }, description: 'Números (#) dos artigos no índice.' } },
      required: ['numeros'],
      additionalProperties: false
    },
    strict: true
  },
  {
    name: 'procurar',
    description: 'Procura uma palavra ou expressão no texto completo de todos os artigos guardados (não distingue maiúsculas). Devolve os números e títulos dos artigos onde aparece.',
    input_schema: {
      type: 'object',
      properties: { termo: { type: 'string' } },
      required: ['termo'],
      additionalProperties: false
    },
    strict: true
  }
];

function buildIndex() {
  // Ordem estável (mais antigo primeiro) para os números não mudarem.
  const items = [...state.articles].sort((a, b) => a.saved_at.localeCompare(b.saved_at));
  const lines = items.map((a, i) =>
    `#${i + 1} | ${topicsOf(a).join(', ') || 'sem tópico'} | ${a.author || a.source} | ${(a.posted_at || a.saved_at).slice(0, 10)} | ${a.title || ''} — ${a.summary || a.text.slice(0, 200).replace(/\s+/g, ' ')}`);
  return { items, text: lines.join('\n') };
}

function runTool(block) {
  const items = state.chatIndex.items;
  const input = block.input || {};
  if (block.name === 'ler_artigos') {
    if (!Array.isArray(input.numeros)) return { error: 'numeros tem de ser uma lista de inteiros.' };
    const nums = input.numeros.slice(0, 10);
    const out = nums.map(n => {
      const a = items[n - 1];
      if (!a) return `#${n}: não existe.`;
      return `<artigo n="${n}" autor="${a.author}" data="${(a.posted_at || a.saved_at).slice(0, 10)}" url="${a.url}">\n${a.title || ''}\n\n${a.text.slice(0, 30000)}\n</artigo>`;
    });
    return { text: out.join('\n\n'), label: `📖 A ler ${nums.map(n => '#' + n).join(', ')}` };
  }
  if (block.name === 'procurar') {
    if (typeof input.termo !== 'string' || !input.termo.trim()) return { error: 'termo em falta.' };
    const t = input.termo.toLowerCase();
    const hits = items.map((a, i) => ({ a, n: i + 1 }))
      .filter(({ a }) => `${a.title} ${a.author} ${a.summary} ${a.text}`.toLowerCase().includes(t))
      .slice(0, 50);
    return {
      text: hits.length ? hits.map(({ a, n }) => `#${n} ${a.title || a.text.slice(0, 80)}`).join('\n') : 'Nenhum artigo contém esse termo.',
      label: `🔎 A procurar “${input.termo}” (${hits.length})`
    };
  }
  return { error: 'Ferramenta desconhecida.' };
}


// ---------- LER: tópicos + posts em modo leitura ----------
function topicCounts() {
  const m = new Map();
  for (const a of state.articles) for (const t of topicsOf(a)) m.set(t, (m.get(t) || 0) + 1);
  return new Map([...m].sort((a, b) => b[1] - a[1]));
}

function filtered() {
  const q = $('#search').value.trim().toLowerCase();
  let list = state.articles;
  if (state.topic === '') list = list.filter(a => !topicsOf(a).length);
  else if (state.topic) list = list.filter(a => topicsOf(a).includes(state.topic));
  if (q) list = list.filter(a => `${a.title} ${a.author} ${a.summary} ${a.text}`.toLowerCase().includes(q));
  return list;
}

function render() {
  const counts = topicCounts();
  const unsorted = state.articles.filter(a => !topicsOf(a).length).length;
  const items = [['__all', 'Tudo', state.articles.length], ...[...counts].map(([t, n]) => [t, t, n])];
  if (unsorted && counts.size) items.push(['__none', 'Por organizar', unsorted]);
  const isActive = k => k === '__all' ? state.topic === null : k === '__none' ? state.topic === '' : state.topic === k;
  $('#topics').innerHTML = items.map(([k, label, n]) =>
    `<li><button data-t="${escapeHtml(k)}" class="${isActive(k) ? 'active' : ''}"><span>${escapeHtml(label)}</span><span class="n">${n}</span></button></li>`).join('');
  $('#topics').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.t;
    selectTopic(t === '__all' ? null : t === '__none' ? '' : t);
  }));
  renderFeed();
}

function selectTopic(t) {
  state.topic = t;
  state.limit = PAGE_SIZE;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------- conteúdo do post (versão completa vinda do X quando existe) ----------
const linkify = s => escapeHtml(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@(\w{1,30})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const paragraphs = text => String(text || '').split(/\n{2,}/).map(p => `<p>${linkify(p).replace(/\n/g, '<br>')}</p>`).join('');

// Partes do texto guardado pela extensão: principal, citações e cartão de link.
function savedParts(text) {
  const [main, ...quotes] = String(text || '').split(/\n\n— citação —\n\n/);
  const li = main.indexOf('\n\n[Link partilhado]\n');
  return { main: li >= 0 ? main.slice(0, li) : main, quotes, link: li >= 0 ? main.slice(li + 20).trim() : '' };
}

const hasPost = a => a.post && !a.post.unavailable;

function postText(a) {
  const saved = savedParts(a.text).main
    .split('\n').filter(l => !/^\s*[\d.,]+\s*[KkMm]?\s*$/.test(l)).join('\n'); // tira gostos/vistas soltos
  if (hasPost(a) && a.post.article) return a.post.article.preview || saved;
  if (!hasPost(a)) return saved;
  // Posts longos: a versão da extensão (lida na página do post) é a completa.
  return a.post.long && saved.length > a.post.text.length ? saved : a.post.text || saved;
}

function authorOf(a) {
  if (hasPost(a)) return { name: a.post.user.name, handle: '@' + a.post.user.handle, avatar: a.post.user.avatar, verified: a.post.user.verified };
  return { name: authorName(a), handle: handle(a), avatar: null, verified: false };
}

function avatarHtml(u) {
  return u.avatar
    ? `<img class="avatar" src="${escapeHtml(u.avatar)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
    : `<div class="avatar" style="background:${avatarColor(u.handle || u.name || '')}">${escapeHtml((u.name || '?')[0].toUpperCase())}</div>`;
}

function mediaList(a) {
  if (hasPost(a)) return a.post.media || [];
  return (Array.isArray(a.images) ? a.images : []).map(url => ({ type: 'photo', url }));
}

function large(url) {
  if (!url.includes('pbs.twimg.com/media')) return url;
  const u = new URL(url);
  u.searchParams.set('name', 'large');
  return u.toString();
}

// Lista (pré-visualização): fotos e capas de vídeo com ▶.
function mediaPreview(media) {
  const items = media.slice(0, 4);
  if (!items.length) return '';
  return `<div class="media n${items.length}">${items.map(m => `
    <div class="m ${m.type !== 'photo' ? 'is-video' : ''}"><img src="${escapeHtml(m.url)}" loading="lazy" alt="" onerror="this.closest('.m').remove()"></div>`).join('')}</div>`;
}

// Leitor: fotos grandes e vídeos a tocar.
function mediaFull(media) {
  if (!media.length) return '';
  return `<div class="full-media">${media.map(m => m.video
    ? `<video controls playsinline preload="metadata" referrerpolicy="no-referrer" poster="${escapeHtml(m.url)}" src="${escapeHtml(m.video)}"></video>`
    : `<a href="${escapeHtml(large(m.url))}" target="_blank" rel="noopener"><img src="${escapeHtml(large(m.url))}" alt="" loading="lazy"></a>`).join('')}</div>`;
}

function cardHtml(c) {
  if (!c || !(c.title || c.domain)) return '';
  return `<a class="xcard" href="${escapeHtml(c.url || '#')}" target="_blank" rel="noopener">
    ${c.image ? `<img src="${escapeHtml(c.image)}" alt="" loading="lazy">` : ''}
    <div><div class="d">${escapeHtml(c.domain || '')}</div><div class="t">${escapeHtml(c.title || '')}</div>${c.description ? `<div class="s">${escapeHtml(c.description)}</div>` : ''}</div>
  </a>`;
}

function quotedHtml(q, full) {
  if (!q) return '';
  return `<div class="quoted">
    <div class="q-head">${avatarHtml({ name: q.user?.name, handle: q.user?.handle, avatar: q.user?.avatar })}<b>${escapeHtml(q.user?.name || '')}</b><span class="muted">@${escapeHtml(q.user?.handle || '')}</span></div>
    <div class="q-body">${paragraphs(q.text)}</div>
    ${full ? mediaFull(q.media || []) : mediaPreview(q.media || [])}
    ${cardHtml(q.card)}
  </div>`;
}

// HTML de artigos longos: só etiquetas seguras.
function safeArticleHtml(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
  const KEEP = new Set(['P', 'H1', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'A', 'STRONG', 'B', 'EM', 'I', 'BR', 'PRE', 'CODE', 'HR', 'FIGURE', 'FIGCAPTION', 'IMG']);
  const clean = node => {
    for (const el of [...node.children]) {
      if (!KEEP.has(el.tagName)) { el.replaceWith(...el.childNodes); continue; }
      for (const attr of [...el.attributes]) {
        const ok = (el.tagName === 'A' && attr.name === 'href' && /^https?:/.test(attr.value)) ||
                   (el.tagName === 'IMG' && attr.name === 'src' && /^https:/.test(attr.value));
        if (!ok) el.removeAttribute(attr.name);
      }
      if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); }
      if (el.tagName === 'IMG') el.setAttribute('loading', 'lazy');
      clean(el);
    }
  };
  let root = doc.body.firstElementChild;
  for (let i = 0; i < 3; i++) clean(root); // repetir apanha nós promovidos
  return root.innerHTML;
}

// ---------- leitor: o post inteiro dentro da app ----------
// Vai buscar o post completo ao FxTwitter (API pública que devolve texto, media e artigos inteiros).
const fxCache = new Map();
function fetchFx(a) {
  const id = a.url.match(/status\/(\d+)/)?.[1];
  if (!id) return Promise.resolve(null);
  if (!fxCache.has(id)) {
    fxCache.set(id, fetch(`https://api.fxtwitter.com/i/status/${id}`)
      .then(r => (r.ok ? r.json() : null)).then(d => d?.tweet || null).catch(() => null));
  }
  return fxCache.get(id);
}

function bestVariant(variants = []) {
  const mp4 = variants.filter(v => (v.content_type || v.format || '').includes('mp4') && v.url)
    .sort((x, y) => (x.bit_rate || x.bitrate || 0) - (y.bit_rate || y.bitrate || 0));
  // a melhor qualidade até ~2.5 Mbps (bom no telemóvel); senão a mais baixa disponível
  return (mp4.filter(v => (v.bit_rate || v.bitrate || 0) <= 2600000).pop() || mp4[0])?.url || null;
}

const videoTag = (src, poster) => `<video controls playsinline preload="metadata" referrerpolicy="no-referrer"${poster ? ` poster="${escapeHtml(poster)}"` : ''} src="${escapeHtml(src)}"></video>`;

function fxMediaHtml(media) {
  const all = media?.all || [];
  if (!all.length) return '';
  return `<div class="full-media">${all.map(m => {
    if (m.type === 'photo') return `<a href="${escapeHtml(m.url)}" target="_blank" rel="noopener"><img src="${escapeHtml(m.url)}" alt="" loading="lazy"></a>`;
    if (m.type === 'gif') return `<video autoplay loop muted playsinline referrerpolicy="no-referrer" src="${escapeHtml(m.url)}"></video>`;
    return videoTag(m.url, m.thumbnail_url);
  }).join('')}</div>`;
}

// Texto rico de um bloco de artigo: negrito, itálico e links.
function richText(block, ents) {
  const text = block.text || '';
  const n = text.length;
  const bold = Array(n).fill(false), ital = Array(n).fill(false), link = Array(n).fill(null);
  for (const s of block.inlineStyleRanges || []) {
    for (let i = s.offset; i < Math.min(n, s.offset + s.length); i++) {
      if (/bold/i.test(s.style)) bold[i] = true;
      if (/italic/i.test(s.style)) ital[i] = true;
    }
  }
  for (const r of block.entityRanges || []) {
    const e = ents[String(r.key)];
    if (e?.type === 'LINK' && /^https?:/.test(e.data?.url || '')) {
      for (let i = r.offset; i < Math.min(n, r.offset + r.length); i++) link[i] = e.data.url;
    }
  }
  let out = '';
  for (let i = 0; i < n;) {
    let j = i;
    while (j < n && bold[j] === bold[i] && ital[j] === ital[i] && link[j] === link[i]) j++;
    let seg = escapeHtml(text.slice(i, j)).replace(/\n/g, '<br>');
    if (bold[i]) seg = `<strong>${seg}</strong>`;
    if (ital[i]) seg = `<em>${seg}</em>`;
    if (link[i]) seg = `<a href="${escapeHtml(link[i])}" target="_blank" rel="noopener">${seg}</a>`;
    out += seg;
    i = j;
  }
  return out;
}

function articleHtml(art) {
  const ents = Object.fromEntries((art.content?.entityMap || []).map(e => [String(e.key), e.value]));
  const media = Object.fromEntries((art.media_entities || []).map(m => [String(m.media_id), m.media_info]));
  const mediaHtml = mi => {
    if (!mi) return '';
    if (mi.variants) { const v = bestVariant(mi.variants); return v ? videoTag(v, mi.preview_image?.original_img_url) : ''; }
    return mi.original_img_url ? `<img src="${escapeHtml(mi.original_img_url)}" alt="" loading="lazy">` : '';
  };
  let html = '', list = null;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const b of art.content?.blocks || []) {
    const lt = b.type === 'unordered-list-item' ? 'ul' : b.type === 'ordered-list-item' ? 'ol' : null;
    if (lt !== list) { closeList(); if (lt) { html += `<${lt}>`; list = lt; } }
    if (b.type === 'atomic') {
      for (const r of b.entityRanges || []) {
        for (const it of ents[String(r.key)]?.data?.mediaItems || []) html += mediaHtml(media[String(it.mediaId)]);
      }
      continue;
    }
    const inner = richText(b, ents);
    if (lt) html += `<li>${inner}</li>`;
    else if (b.type === 'header-one') html += `<h2>${inner}</h2>`;
    else if (b.type === 'header-two') html += `<h3>${inner}</h3>`;
    else if (b.type === 'header-three') html += `<h4>${inner}</h4>`;
    else if (b.type === 'blockquote') html += `<blockquote>${inner}</blockquote>`;
    else if (b.type === 'code-block') html += `<pre>${inner}</pre>`;
    else if (inner.trim()) html += `<p>${inner}</p>`;
  }
  closeList();
  return html;
}

function articlePlainText(art) {
  return (art.content?.blocks || []).map(b => b.type === 'atomic' ? '[imagem]' : b.text).filter(Boolean).join('\n\n');
}

function fxQuoteHtml(q) {
  if (!q) return '';
  return `<div class="quoted">
    <div class="q-head">${avatarHtml({ name: q.author?.name, handle: q.author?.screen_name, avatar: q.author?.avatar_url })}<b>${escapeHtml(q.author?.name || '')}</b><span class="muted">@${escapeHtml(q.author?.screen_name || '')}</span></div>
    ${q.article ? `<div class="q-body"><b>${escapeHtml(q.article.title || '')}</b><p>${escapeHtml(q.article.preview_text || '')}</p></div>` : `<div class="q-body">${paragraphs(q.text)}</div>`}
    ${fxMediaHtml(q.media)}
  </div>`;
}

const fmtNum = n => (n == null ? '' : Number(n).toLocaleString('pt-PT'));

function postViewHtml(a, t) {
  // t = post completo do FxTwitter (ou null enquanto carrega / se falhar)
  const u = t
    ? { name: t.author?.name, handle: '@' + (t.author?.screen_name || ''), avatar: t.author?.avatar_url, verified: Boolean(t.author?.verification?.verified) }
    : authorOf(a);
  const date = t?.created_timestamp ? new Date(t.created_timestamp * 1000).toISOString() : (a.posted_at || a.saved_at);
  let body;
  if (t?.article) {
    const art = t.article;
    const cover = art.cover_media?.media_info?.original_img_url;
    body = `${cover ? `<img class="pv-cover" src="${escapeHtml(cover)}" alt="">` : ''}
      <h1 class="pv-title">${escapeHtml(art.title || '')}</h1>
      <div class="article">${articleHtml(art)}</div>`;
  } else if (t) {
    body = `<div class="full-body">${paragraphs(t.text)}</div>${fxMediaHtml(t.media)}${fxQuoteHtml(t.quote)}`;
  } else {
    // ainda sem a versão do X: o que está guardado
    const fallbackArticle = hasPost(a) && a.post.article;
    body = (fallbackArticle
      ? `${a.post.article.cover ? `<img class="pv-cover" src="${escapeHtml(a.post.article.cover)}" alt="">` : ''}<h1 class="pv-title">${escapeHtml(a.post.article.title || a.title || '')}</h1>`
      : '') +
      `<div class="full-body">${paragraphs(postText(a))}</div>` +
      (hasPost(a) ? mediaFull(a.post.media || []) + quotedHtml(a.post.quoted, true) + cardHtml(a.post.card) : mediaFull(mediaList(a)));
  }
  const stats = t
    ? `♥ ${fmtNum(t.likes)} · ↻ ${fmtNum(t.retweets)} · 💬 ${fmtNum(t.replies)}${t.views ? ` · 👁 ${fmtNum(t.views)}` : ''}`
    : hasPost(a) && a.post.likes != null ? `♥ ${fmtNum(a.post.likes)} · 💬 ${fmtNum(a.post.replies)}` : '';
  return `
    <div class="pv-author">
      ${avatarHtml(u)}
      <div class="who">
        <div class="name">${escapeHtml(u.name || '')}${u.verified ? ' <span class="tick">✓</span>' : ''}</div>
        <div class="meta">${escapeHtml(u.handle || '')} · ${fmtDate(date)}</div>
      </div>
    </div>
    ${body}
    ${stats ? `<div class="pv-stats">${stats}</div>` : ''}
    ${a.summary ? `<div class="pv-summary"><b>Resumo da IA</b>${escapeHtml(a.summary)}</div>` : ''}
    <div class="pv-actions">
      <a class="btn" href="${escapeHtml(a.url)}" target="_blank" rel="noopener">Ver no X ↗</a>
      <button class="btn" data-act="topics">Tópicos</button>
      <button class="btn quiet" data-act="del">Apagar</button>
    </div>`;
}

// ---------- chat sobre este post ----------
const POST_CHAT_PROMPT = `És o assistente de leitura do utilizador. Ele está a ler o post/artigo abaixo, que guardou do X, e quer conversar sobre ele.

Responde em português de Portugal, direto e sem floreados. Baseia-te no conteúdo do post; se algo não estiver lá, diz isso antes de acrescentares conhecimento geral. Podes resumir, criticar, extrair passos práticos, explicar termos ou dizer se vale a pena.`;

state.pc = null; // conversa do post aberto

function postContext(a, t) {
  if (t?.article) return `Título: ${t.article.title}\nAutor: ${t.author?.name} (@${t.author?.screen_name})\n\n${articlePlainText(t.article)}`;
  if (t) return `Autor: ${t.author?.name} (@${t.author?.screen_name})\n\n${t.text}${t.quote ? `\n\n[Post citado de @${t.quote.author?.screen_name}]\n${t.quote.text}` : ''}${t.media?.all?.length ? `\n\n[${t.media.all.length} imagem/vídeo no post]` : ''}`;
  return `Autor: ${authorOf(a).name} (${authorOf(a).handle})\n\n${a.text}`;
}

function addPcMessage(role, text) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = renderMarkdown(text);
  $('#pc-messages').appendChild(el);
  el.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return el;
}

async function askPost(question) {
  const pc = state.pc;
  pc.history.push({ role: 'user', content: question });
  pc.display.push({ role: 'user', text: question });
  addPcMessage('user', question);
  const system = `${POST_CHAT_PROMPT}\n\n<post url="${pc.url}">\n${pc.context}\n</post>`;
  let answer = '';
  if (cfg().provider === 'openrouter') {
    const wait = addPcMessage('activity', 'A pensar…');
    let choice;
    try {
      choice = await openrouter({
        max_tokens: 16000, reasoning: { effort: 'medium' },
        messages: [{ role: 'system', content: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }] }, ...pc.history]
      });
    } finally { wait.remove(); }
    answer = choice.message?.content || '(sem resposta)';
    pc.history.push({ role: 'assistant', content: answer });
    addPcMessage('assistant', answer);
  } else {
    let bubble = null;
    const res = await claude({
      max_tokens: 16000, output_config: { effort: 'medium' }, cache_control: { type: 'ephemeral' },
      system, messages: pc.history
    }, d => { answer += d; bubble ||= addPcMessage('assistant', ''); bubble.innerHTML = renderMarkdown(answer); });
    pc.history.push({ role: 'assistant', content: res.content.length ? res.content : '(sem resposta)' });
    if (!answer) addPcMessage('assistant', '(sem resposta)');
  }
  if (answer) pc.display.push({ role: 'assistant', text: answer });
  // guarda junto das outras conversas
  const body = { title: `📄 ${pc.title}`.slice(0, 120), messages: [{ role: 'user', text: `(Conversa sobre o post ${pc.url})` }, ...pc.display], updated_at: new Date().toISOString() };
  try {
    if (pc.chatId) await sb(`chats?id=eq.${pc.chatId}`, { method: 'PATCH', body: JSON.stringify(body) });
    else pc.chatId = (await sb('chats', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(body) }))[0].id;
  } catch { /* sem tabela de conversas: segue sem guardar */ }
}

$('#pc-form').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('#pc-input').value.trim();
  if (!q || !state.pc || state.pc.busy) return;
  state.pc.busy = true; $('#pc-send').disabled = true; $('#pc-input').value = ''; $('#pc-input').style.height = 'auto';
  $('#pc-section').classList.remove('hidden');
  try { await askPost(q); } catch (err) { addPcMessage('error', err.message); }
  finally { if (state.pc) state.pc.busy = false; $('#pc-send').disabled = false; }
});

});

function bindPostActions(a) {
  const v = $('#pv-content');
  v.querySelector('[data-act="topics"]').addEventListener('click', () => editTopics(a));
  v.querySelector('[data-act="del"]').addEventListener('click', () => deletePost(a));
}

function openPost(a) {
  state.pv = a;
  state.pc = { url: a.url, title: a.title || postText(a).slice(0, 60), context: postContext(a, null), history: [], display: [], chatId: null, busy: false };
  $('#pv-content').innerHTML = postViewHtml(a, null);
  $('#pc-messages').innerHTML = '';
  $('#pc-section').classList.add('hidden');
  $('#pc-input').value = '';
  bindPostActions(a);
  $('#post-view').classList.add('on');
  $('#post-view').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  if (location.hash !== '#post') history.pushState({ post: a.id }, '', '#post');

  fetchFx(a).then(t => {
    if (!t || state.pv !== a) return;
    $('#pv-content').innerHTML = postViewHtml(a, t);
    bindPostActions(a);
    if (state.pc && !state.pc.history.length) {
      state.pc.context = postContext(a, t);
      if (t.article?.title) state.pc.title = t.article.title;
    }
  });
}

    $('#input').value = b.textContent;
    $('#composer').requestSubmit();
  }));
}

function addMessage(role, text) {
  $('#messages-inner .intro')?.remove();
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = renderMarkdown(text);
  $('#messages-inner').appendChild(el);
  $('#messages').scrollTop = $('#messages').scrollHeight;
  return el;
}

async function ask(question) {
  if (!state.chatIndex) state.chatIndex = buildIndex(); // fixo durante a conversa
  return cfg().provider === 'openrouter' ? askOpenRouter(question) : askAnthropic(question);
}

async function askOpenRouter(question) {
  const tools = TOOLS.map(t => ({
    type: 'function',
    function: { name: t.name, description: t.description, parameters: t.input_schema, strict: true }
  }));
  const system = {
    role: 'system',
    content: [
      { type: 'text', text: CHAT_PROMPT },
      { type: 'text', text: `<indice total="${state.chatIndex.items.length}">\n${state.chatIndex.text || '(vazio)'}\n</indice>`, cache_control: { type: 'ephemeral' } }
    ]
  };
  state.history.push({ role: 'user', content: question });
  addMessage('user', question);

  for (let round = 0; round < 10; round++) {
    const wait = addMessage('activity', 'A pensar…');
    let choice;
    try {
      choice = await openrouter({ max_tokens: 32000, reasoning: { effort: 'medium' }, tools, messages: [system, ...state.history] });
    } finally {
      wait.remove();
    }
    const msg = choice.message || {};
    const turn = { role: 'assistant', content: msg.content || '' };
    if (msg.tool_calls?.length) turn.tool_calls = msg.tool_calls;
    if (msg.reasoning_details) turn.reasoning_details = msg.reasoning_details; // necessário para continuar depois das ferramentas
    state.history.push(turn);
    if (msg.content) addMessage('assistant', msg.content);
    if (!msg.tool_calls?.length) {
      if (!msg.content) addMessage('assistant', '(sem resposta)');
      return;
    }
    for (const tc of msg.tool_calls) {
      let input = null;
      try { input = JSON.parse(tc.function.arguments || '{}'); } catch {}
      const r = input ? runTool({ name: tc.function.name, input }) : { error: 'Argumentos inválidos (JSON).' };
      if (r.label) addMessage('activity', r.label);
      state.history.push({ role: 'tool', tool_call_id: tc.id, content: r.error ? 'Erro: ' + r.error : r.text });
    }
  }
  addMessage('activity', '(parei: demasiados passos seguidos)');
}

async function askAnthropic(question) {
  const system = [
    { type: 'text', text: CHAT_PROMPT },
    { type: 'text', text: `<indice total="${state.chatIndex.items.length}">\n${state.chatIndex.text || '(vazio)'}\n</indice>` }
  ];
  state.history.push({ role: 'user', content: question });
  addMessage('user', question);

  for (let round = 0; round < 10; round++) {
    let bubble = null, text = '';
    const res = await claude({
      max_tokens: 32000,
      output_config: { effort: 'medium' },
      cache_control: { type: 'ephemeral' },
      system,
      tools: TOOLS,
      messages: state.history
    }, delta => {
      text += delta;
      bubble ||= addMessage('assistant', '');
      bubble.innerHTML = renderMarkdown(text);
      bubble.scrollIntoView({ block: 'end' });
    });
    state.history.push({ role: 'assistant', content: res.content.length ? res.content : '(sem resposta)' });

    if (res.stopReason === 'refusal' && !text) addMessage('assistant', '(O modelo recusou responder a este pedido.)');
    if (res.stopReason !== 'tool_use') return;

    const results = res.content.filter(b => b.type === 'tool_use').map(b => {
      const r = runTool(b);
      if (r.label) addMessage('activity', r.label);
      return r.error
        ? { type: 'tool_result', tool_use_id: b.id, content: r.error, is_error: true }
        : { type: 'tool_result', tool_use_id: b.id, content: r.text };
    });
    state.history.push({ role: 'user', content: results });
  }
  addMessage('activity', '(parei: demasiados passos seguidos)');
}


// Texto das respostas do assistente a partir de uma posição do histórico.
function assistantTextSince(i) {
  return state.history.slice(i)
    .filter(m => m.role === 'assistant')
    .map(m => typeof m.content === 'string' ? m.content : (m.content || []).filter(b => b.type === 'text').map(b => b.text).join(''))
    .filter(t => t && t !== '(sem resposta)')
    .join('\n\n');
}

$('#composer').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('#input').value.trim();
  if (!q || state.busy) return;
  state.busy = true; $('#send').disabled = true; $('#input').value = ''; $('#input').style.height = 'auto';
  const start = state.history.length;
  state.display.push({ role: 'user', text: q });
  if (!state.chatTitle) state.chatTitle = q.slice(0, 90);
  try { await ask(q); } catch (err) { addMessage('error', err.message); }
  const answer = assistantTextSince(start);
  if (answer) state.display.push({ role: 'assistant', text: answer });
  state.busy = false; $('#send').disabled = false;
  persistChat();
});
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(min-width: 821px)').matches) { e.preventDefault(); $('#composer').requestSubmit(); }
});
$('#input').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });

// ---------- CONVERSAR: guardar e retomar conversas (tabela "chats" no Supabase) ----------
async function persistChat() {
  if (!state.display.length) return;
  const body = { title: state.chatTitle, messages: state.display, updated_at: new Date().toISOString() };
  try {
    if (state.chatId) {
      await sb(`chats?id=eq.${state.chatId}`, { method: 'PATCH', body: JSON.stringify(body) });
    } else {
      const rows = await sb('chats', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(body) });
      state.chatId = rows[0].id;
    }
    loadChats();
  } catch (err) {
    setBanner('Não consegui guardar a conversa');
    console.warn(err);
  }
}

async function loadChats() {
  const list = $('#chat-list');
  try {
    const rows = await sb('chats?select=id,title,updated_at&order=updated_at.desc&limit=100');
    list.innerHTML = rows.length ? '' : '<li class="none">Ainda não tens conversas.</li>';
    for (const c of rows) {
      const li = document.createElement('li');
      li.className = c.id === state.chatId ? 'active' : '';
      li.innerHTML = `<button class="open"><span class="t">${escapeHtml(c.title || 'Conversa')}</span><span class="d">${fmtShort(c.updated_at)}</span></button><button class="del" title="Apagar">✕</button>`;
      li.querySelector('.open').addEventListener('click', () => openSavedChat(c.id));
      li.querySelector('.del').addEventListener('click', async () => {
        if (!confirm('Apagar esta conversa?')) return;
        await sb(`chats?id=eq.${c.id}`, { method: 'DELETE' });
        if (state.chatId === c.id) newChat();
        loadChats();
      });
      list.appendChild(li);
    }
  } catch {
    list.innerHTML = '<li class="none">As conversas ainda não estão ativas no Supabase.</li>';
  }
}

async function openSavedChat(id) {
  if (state.busy) return;
  const [c] = await sb(`chats?id=eq.${id}&select=*`);
  if (!c) return;
  state.chatId = c.id;
  state.chatTitle = c.title || '';
  state.display = Array.isArray(c.messages) ? c.messages : [];
  // Retoma só com o texto (sem blocos internos da sessão anterior).
  state.history = state.display.map(m => ({ role: m.role, content: m.text }));
  state.chatIndex = null;
  $('#messages-inner').innerHTML = '';
  for (const m of state.display) addMessage(m.role, m.text);
  if (!state.display.length) chatIntro();
  document.body.classList.remove('show-chats');
  loadChats();
}

function newChat() {
  state.history = []; state.display = []; state.chatId = null; state.chatTitle = ''; state.chatIndex = null;
  chatIntro();
  document.body.classList.remove('show-chats');
  loadChats();
}
$('#new-chat').addEventListener('click', newChat);
$('#new-chat-m').addEventListener('click', newChat);
$('#toggle-chats').addEventListener('click', () => document.body.classList.toggle('show-chats'));

// ---------- voz (Web Speech API) ----------
function attachMic(mic, input, hint, form) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { mic.classList.add('hidden'); return; }
  let rec = null, base = '', heard = '';
  mic.addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'pt-PT';
    rec.interimResults = true;
    rec.continuous = false;
    base = input.value.trim() ? input.value.trim() + ' ' : '';
    heard = '';
    rec.onstart = () => { mic.classList.add('listening'); hint.textContent = 'A ouvir… carrega outra vez para parar.'; };
    rec.onresult = e => {
      heard = [...e.results].map(r => r[0].transcript).join('');
      input.value = base + heard;
      input.dispatchEvent(new Event('input'));
    };
    rec.onerror = e => {
      hint.textContent = e.error === 'not-allowed' ? 'Dá permissão ao microfone para usar a voz.' : 'Não percebi — tenta outra vez.';
    };
    rec.onend = () => {
      mic.classList.remove('listening');
      rec = null;
      if (heard.trim()) { hint.textContent = ''; form.requestSubmit(); }
      else if (hint.textContent.startsWith('A ouvir')) hint.textContent = '';
    };
    rec.start();
  });
}
attachMic($('#mic'), $('#input'), $('#voice-hint'), $('#composer'));
attachMic($('#pc-mic'), $('#pc-input'), $('#pc-voice-hint'), $('#pc-form'));

// ---------- definições ----------
const dlg = $('#settings');
function openSettings() {
  const c = cfg();
  for (const k of CFG_KEYS) $('#' + k).value = c[k];
  $('#settings-status').textContent = '';
  dlg.showModal();
}
$('#open-settings').addEventListener('click', openSettings);
$('#close-settings').addEventListener('click', () => dlg.close());
$('#refresh').addEventListener('click', async () => {
  try { setBanner('A atualizar…'); await loadArticles(); setBanner(''); classifyPending(); }
  catch (err) { setBanner('Erro: ' + err.message); }
});
$('#save-settings').addEventListener('click', async () => {
  const before = cfg().provider;
  for (const k of CFG_KEYS) { try { localStorage.setItem('xmem_' + k, $('#' + k).value.trim()); } catch {} }
  if (cfg().provider !== before) newChat();
  $('#settings-status').textContent = 'A ligar…';
  try {
    await loadArticles();
    $('#settings-status').textContent = `Ligado ✓ (${state.articles.length} posts)`;
    setTimeout(() => dlg.close(), 800);
    classifyPending();
  } catch (err) {
    $('#settings-status').textContent = 'Não consegui ligar: ' + err.message;
  }
});
$('#reclassify').addEventListener('click', async () => {
  if (!confirm('Apagar os tópicos atuais e voltar a organizar tudo do zero? (usa a IA para todos os posts)')) return;
  await sb('articles?topics=not.is.null', { method: 'PATCH', body: JSON.stringify({ topics: null }) });
  state.articles.forEach(a => { a.topics = null; });
  dlg.close();
  render();
  classifyPending();
});

// Botão mostrar/esconder nos campos de chaves.
document.querySelectorAll('input[type="password"]').forEach(input => {
  const wrap = document.createElement('div');
  wrap.className = 'reveal-wrap';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'reveal-btn';
  btn.textContent = 'mostrar';
  btn.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'esconder' : 'mostrar';
  });
  wrap.appendChild(btn);
});

// ---------- arranque ----------
// Link de configuração vindo da extensão: https://…/#setup=<base64>. Guarda e apaga do endereço.
function applySetupLink() {
  const m = location.hash.match(/^#setup=([\w-]+)/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const data = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    for (const k of CFG_KEYS) if (data[k]) localStorage.setItem('xmem_' + k, data[k]);
    return true;
  } catch { return false; }
}
window.addEventListener('hashchange', () => { if (applySetupLink()) location.reload(); });

(async () => {
  if (applySetupLink()) setBanner('Configurado ✓');
  chatIntro();
  try { if (localStorage.getItem('xmem_mode') === 'chat') setMode('chat'); } catch {}
  const c = cfg();
  if (!c.supabaseKey) { render(); openSettings(); return; }
  try {
    await loadArticles();
    classifyPending();
  } catch (err) {
    $('#feed').innerHTML = `<div class="msg error">${escapeHtml(err.message)}</div>`;
  }
})();
</script>
